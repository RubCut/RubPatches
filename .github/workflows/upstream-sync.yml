# Brings MargyT's own source into this repository, so a rebase can be done
# without reaching its forge.
#
# RubTT is a fork of MargyT: `inject/java/cat/narezany/rubtt` is MargyT's
# `inject/java/cat/narezany/margyt` with the package renamed, and `rubtt/` is
# `margyt/`. MargyT lives on a small forge of its own, which is not reachable
# from every machine, so this job fetches it here and leaves the newest tag and
# the fork point as a branch -- `upstream/margyt`, an orphan branch holding
# nothing but MargyT's own tree, one directory per tag. It is not merged into
# anything and nothing builds from it; it is a doorway, not a copy.
#
# Run it from the Actions tab when MargyT ships something worth taking.
name: Bring upstream MargyT in

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upstream-sync.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Clone MargyT and its tags
        run: |
          git clone --quiet https://git.narez.xyz/narezany/MargyT upstream
          git -C upstream tag --list 'v2*' | sort -V | tee tags.txt
          newest=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' tags.txt | sort -V | tail -1)
          echo "NEWEST=$newest" >> "$GITHUB_ENV"

      - name: Cut the trees a three-way merge wants
        run: |
          # a whole tag, not a list of paths: one release did not have every
          # path the next one does, and `git archive` refuses the lot
          for tag in v2.0.5 "$NEWEST"; do
            mkdir -p "tree/$tag"
            git -C upstream archive --format=tar "$tag" | tar -x -C "tree/$tag"
          done
          cp tags.txt tree/

      - name: Leave them on a branch of their own
        run: |
          cd tree
          git init --quiet -b upstream/margyt .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "MargyT $NEWEST, and 2.0.5 as the fork point"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            HEAD:refs/heads/upstream/margyt
